[package]
name = "vsh-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "_vsh"
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
conflaguration.workspace = true
pyo3 = { version = "0.29.2", default-features = false, features = ["abi3-py39", "macros"] }
proxima-primitives.workspace = true
vsh-core = { version = "0.8.0", path = "../vsh-core" }

[build-dependencies]
pyo3-build-config = "0.29.2"
