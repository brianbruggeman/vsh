[workspace]
resolver = "3"
members = ["crates/vsh-core", "crates/vsh-cli", "crates/vsh-py"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brianbruggeman/vsh"
authors = ["Brian Bruggeman <1350114+brianbruggeman@users.noreply.github.com>"]

[workspace.dependencies]
conflaguration = { version = "2.0.0", features = ["derive", "toml"] }
serde = { version = "1.0.229", features = ["derive"] }
temp-env = "0.3.6"
serde_json = "1.0.149"
proxima-primitives = { git = "https://github.com/brianbruggeman/proxima", rev = "875e56d366083f6fea4128626eb546a6269931db", default-features = false }
toml = "0.8.23"

[workspace.lints.rust]
unsafe_code = "forbid"
