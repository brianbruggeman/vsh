[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "vsh"
version = "0.8.0"
description = "A Rust virtual environment manager with a Python API"
requires-python = ">=3.9"
readme = "README.rst"
license = { file = "LICENSE" }

[project.scripts]
vsh = "vsh:main"

[tool.maturin]
manifest-path = "crates/vsh-py/Cargo.toml"
python-source = "python"
module-name = "vsh._vsh"
features = ["extension-module"]
include = [{ path = "CHANGES.rst", format = "sdist" }]
